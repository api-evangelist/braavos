aid: braavos
name: Braavos
description: 'Braavos is a self-custody smart-contract wallet for Bitcoin and Starknet,
  available as a browser extension and mobile app. Built on Starknet account abstraction,
  it adds hardware-backed two-factor signing (mobile secure element and passkeys),
  session keys for dApps, gas abstraction, in-wallet swaps, staking, and fiat on-ramp.
  Its developer surface is the injected Starknet wallet API (get-starknet), the Braavos
  Cairo account contracts, and first-party JavaScript libraries (session keys, deeplinks,
  StarkNet URLs, dApp metadata) published under the myBraavos GitHub organization.
  Braavos does not publish a hosted REST API or OpenAPI. Sector: crypto. Backed by
  Pantera Capital.'
